[package]
name = "meeting-recorder"
version = "0.4.2"
edition = "2021"
license = "Apache-2.0"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui-phosphor = "0.9.0"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
realfft = "3.5.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target.'cfg(windows)'.dependencies.wasapi]
version = "0.27.0"

[build-dependencies]
winresource = "0.1"
