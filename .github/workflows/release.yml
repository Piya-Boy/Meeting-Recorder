name: Release

# A tag vN.N.N builds the Windows zip and makes a DRAFT Release (publishing it is a manual step).
# Started by hand it only builds and uploads the zip as an artifact: nothing is published.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install

      - name: Read the version from Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $version) { Write-Error 'No version in Cargo.toml'; exit 1 }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: The tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne "v$env:VERSION") {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match the Cargo.toml version $env:VERSION"
            exit 1
          }

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package the zip and its checksum
        shell: pwsh
        run: |
          $name = "meeting-recorder-v$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item target/release/meeting-recorder.exe, LICENSE, THIRD_PARTY_NOTICES.md, README.md -Destination "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist/SHA256SUMS.txt", "$hash  $name.zip`n")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meeting-recorder-windows
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: meeting-recorder-windows
          path: dist

      - name: The checksum matches the zip
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Create the draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY"             --title "Meeting Recorder $GITHUB_REF_NAME"             --generate-notes             --verify-tag             --draft
