# cargo-about: collects the licence texts of everything linked into the Windows program.
# Regenerate with `python .github/scripts/third_party_licenses.py`.

# In order of preference: a crate offered under several licences is listed under the first.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The program itself; its licence is the LICENSE file.
[meeting-recorder]
accepted = ["PolyForm-Noncommercial-1.0.0"]

# ── Clarifications ──────────────────────────────────────────────────────────
# Without these the output carries the template line "Copyright (c) <year> <copyright holders>".
# A checksum that stops matching drops the clarification, and the generator script then fails.

# windows-rs ships `license-mit` (Copyright (c) Microsoft Corporation), indented, which is not
# recognised. The file is the same in every version linked here.
[windows.clarify]
license = "MIT"
[[windows.clarify.files]]
path = "license-mit"
checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383"

